# DFR OpenAPI semantic gate config (DFR-M1-A03)
#
# Spec source: docs/architecture/m1-api-contract.md, section 7.
# Entry script: scripts/lint-openapi.sh (called by pnpm verify and CI).
#
# Design principles:
#   1. Rule severity is declared **explicitly** here, not left to the tool's
#      implicit defaults. @redocly/cli is already pinned to an exact version
#      in package.json, but listing severity explicitly makes any
#      "gate-strength change" visible in review instead of drifting silently
#      with a tool upgrade.
#   2. `error`-level rules are the substantive strength of the gate:
#      a semantic violation blocks.
#   3. Known, recorded warnings stay `warn` — never silently closed — so
#      there are no "invisible problems".
#      The current warning list and their dispositions are in
#      docs/development/deliveries/DFR-M1-A03.md.
extends:
  - recommended

rules:
  # ---------------------------------------------------------------------------
  # Semantic correctness: error — if any of these is violated, the HTTP
  # contract is unimplementable or unroutable
  # ---------------------------------------------------------------------------
  struct: error
  no-unresolved-refs: error
  operation-operationId: error
  operation-operationId-unique: error
  operation-parameters-unique: error
  path-parameters-defined: error
  no-identical-paths: error
  no-ambiguous-paths: error
  security-defined: error
  no-invalid-parameter-examples: error
  no-invalid-media-type-examples: error

  # ---------------------------------------------------------------------------
  # Known warnings (stay warn, do not close)
  # ---------------------------------------------------------------------------
  # DFR is a proprietary internal API with no license URL / SPDX identifier
  # to fill in.
  # Keep warn rather than off: if the license field is ever removed, this
  # rule will still flag it.
  info-license-strict: warn

  # Interop hint for inline oneOf + discriminator: **fixed** (TODO-005,
  # 2026-10-05).
  # The 12 branches (AssetRef x2 / BlockRef x4 / TransactionRef x2 /
  # FinalityPolicy x4) have been promoted to named schemas, and unions
  # reference them uniformly via $ref.
  # Keep the rule warn rather than off: if someone inlines a branch again,
  # it will still flag it;
  # and `tests/contract/spec-consistency.test.ts` has an assertion that
  # upgrades it to **mandatory**.
  no-illogical-composition-keywords: warn
