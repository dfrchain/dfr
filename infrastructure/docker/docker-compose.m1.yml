# DFR M1 local all-in-one sample: PostgreSQL + Gateway (DFR-M1-E02).
#
# **Not a production deployment file**: the image runs TS from source and
# exposes only localhost ports. Its purpose is to make "run M1 from a clean
# environment" executable and reproducible, and to demonstrate migration
# identity separated from runtime identity.
#
# Relationship to `docker-compose.test.yml`:
#   - Reuses the same `.env` variables and `initdb/01-roles.sh` (the single
#     source for roles and passwords);
#   - But does **not reuse the containers**: the test compose pins a
#     container_name and port 55432, so a direct `include` would clash with
#     a running test database. The sample therefore exposes no database port
#     (the gateway uses the compose network) and pins no container_name, so
#     both can run at the same time.
#   - Both take `initdb/01-roles.sh` as the source for role definitions; to
#     change roles, sync that script, not this file.
#
# Usage:
#   cd infrastructure/docker
#   cp .env.example .env        # fill in random passwords (.env is excluded by .gitignore)
#   # Append as needed: DFR_M0_API_KEY_ID / DFR_M0_API_KEY_HASH / DFR_PROVIDER_ETHEREUM_SEPOLIA_*_URL
#   docker compose -f docker-compose.m1.yml up -d --build --wait postgres
#   docker compose -f docker-compose.m1.yml --profile tools run --rm migrate
#   docker compose -f docker-compose.m1.yml up -d gateway
#   curl -s localhost:8787/readyz
#   docker compose -f docker-compose.m1.yml down -v
name: dfr-m1-sample

services:
  postgres:
    image: postgres:17-alpine
    restart: 'no'
    environment:
      POSTGRES_DB: dfr_m1_test
      POSTGRES_USER: dfr_bootstrap
      POSTGRES_PASSWORD: ${DFR_POSTGRES_BOOTSTRAP_PASSWORD:?set DFR_POSTGRES_BOOTSTRAP_PASSWORD in .env}
      DFR_MIGRATOR_PASSWORD: ${DFR_POSTGRES_MIGRATOR_PASSWORD:?set DFR_POSTGRES_MIGRATOR_PASSWORD in .env}
      DFR_RUNTIME_PASSWORD: ${DFR_POSTGRES_RUNTIME_PASSWORD:?set DFR_POSTGRES_RUNTIME_PASSWORD in .env}
    volumes:
      - dfr-m1-sample-pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # One-shot migration task: uses the **migration identity** (can do DDL),
  # separated from the application container's runtime identity.
  migrate:
    image: dfr-gateway:m1
    build:
      context: ../..
      dockerfile: infrastructure/docker/gateway.Dockerfile
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DFR_TRANSACTION_MIGRATION_DATABASE_URL: >-
        postgres://dfr_migrator:${DFR_POSTGRES_MIGRATOR_PASSWORD:?set DFR_POSTGRES_MIGRATOR_PASSWORD in .env}@postgres:5432/dfr_m1_test
    command:
      - node
      - --experimental-strip-types
      - --experimental-transform-types
      - --import
      - ./scripts/ts-runtime/register.mjs
      - packages/storage-postgres/src/migrate-cli.ts
    restart: 'no'
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  gateway:
    image: dfr-gateway:m1
    build:
      context: ../..
      dockerfile: infrastructure/docker/gateway.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Host port is overridable: default 18787, to avoid clashing with other
      # services on the host (e.g. common debug ports).
      # Inside the container it is always 8787, matching the image EXPOSE / health check.
      - '127.0.0.1:${DFR_GATEWAY_HOST_PORT:-18787}:8787'
    environment:
      DFR_GATEWAY_PORT: '8787'
      DFR_M0_API_KEY_ID: ${DFR_M0_API_KEY_ID:?set DFR_M0_API_KEY_ID in .env}
      DFR_M0_API_KEY_HASH: ${DFR_M0_API_KEY_HASH:?set DFR_M0_API_KEY_HASH in .env}
      DFR_M0_API_KEY_PEPPER: ${DFR_M0_API_KEY_PEPPER:-}
      DFR_M0_PROJECT_ID: ${DFR_M0_PROJECT_ID:-default}
      # Explicit write-path switch; if any of the three prerequisites is missing, the request is rejected (403 / 422).
      DFR_M1_ALLOW_WRITE: ${DFR_M1_ALLOW_WRITE:-false}
      # ADR-038: runtime milestone (M0..M7). When unset, historical behavior is kept (the write switch decides M0/M1);
      # BEX's M4 two-chain deployment must explicitly set M4, otherwise arbitrum-sepolia is filtered out by the milestone gate.
      DFR_DEPLOY_MILESTONE: ${DFR_DEPLOY_MILESTONE:-}
      # Runtime identity: DML only. The application container does **not** hold migration-identity credentials.
      DFR_TRANSACTION_DATABASE_URL: >-
        postgres://dfr_runtime:${DFR_POSTGRES_RUNTIME_PASSWORD:?set DFR_POSTGRES_RUNTIME_PASSWORD in .env}@postgres:5432/dfr_m1_test
      DFR_PROVIDER_ETHEREUM_SEPOLIA_PRIMARY_URL: ${DFR_PROVIDER_ETHEREUM_SEPOLIA_PRIMARY_URL:?set the primary Provider URL in .env}
      DFR_PROVIDER_ETHEREUM_SEPOLIA_PRIMARY_KEY: ${DFR_PROVIDER_ETHEREUM_SEPOLIA_PRIMARY_KEY:-}
      DFR_PROVIDER_ETHEREUM_SEPOLIA_SECONDARY_URL: ${DFR_PROVIDER_ETHEREUM_SEPOLIA_SECONDARY_URL:?set the backup Provider URL in .env}
      DFR_PROVIDER_ETHEREUM_SEPOLIA_SECONDARY_KEY: ${DFR_PROVIDER_ETHEREUM_SEPOLIA_SECONDARY_KEY:-}
      # M4 legs (base-sepolia / arbitrum-sepolia): the registry enables these two chains in M4,
      # so their Provider variables must also be injected into the container, otherwise chain info / logs / contract reads
      # fail with DFR_CONFIGURATION_ERROR (found in a 2026-10-06 live test). Empty by default means the chain is not enabled.
      DFR_PROVIDER_BASE_SEPOLIA_PRIMARY_URL: ${DFR_PROVIDER_BASE_SEPOLIA_PRIMARY_URL:-}
      DFR_PROVIDER_BASE_SEPOLIA_PRIMARY_KEY: ${DFR_PROVIDER_BASE_SEPOLIA_PRIMARY_KEY:-}
      DFR_PROVIDER_ARBITRUM_SEPOLIA_PRIMARY_URL: ${DFR_PROVIDER_ARBITRUM_SEPOLIA_PRIMARY_URL:-}
      DFR_PROVIDER_ARBITRUM_SEPOLIA_PRIMARY_KEY: ${DFR_PROVIDER_ARBITRUM_SEPOLIA_PRIMARY_KEY:-}
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    # Log rotation: the application only writes stdout/stderr (JSON Lines); rotation is the container runtime's job.
    # For a single-host compose setup, an explicit cap is required — otherwise the json-file driver grows unboundedly and fills the disk.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  dfr-m1-sample-pgdata:
