# Isolated staging fault drill (touches no shared M4 container).
#
# Dedicated container names, ports, and volumes, to avoid clashing with
# docker-compose.test.yml / docker-compose.m1.yml. Passwords are generated at
# runtime by scripts/staging-fault-drill.sh, injected only via environment
# variables, never written to the repository or echoed.
name: dfr-staging-fault-drill

services:
  postgres:
    image: postgres:17-alpine
    container_name: dfr-staging-drill-postgres
    restart: 'no'
    ports:
      - '127.0.0.1:55433:5432'
    environment:
      POSTGRES_DB: dfr_staging_drill
      POSTGRES_USER: dfr_bootstrap
      POSTGRES_PASSWORD: ${DFR_DRILL_BOOTSTRAP_PASSWORD:?missing}
      DFR_MIGRATOR_PASSWORD: ${DFR_DRILL_MIGRATOR_PASSWORD:?missing}
      DFR_RUNTIME_PASSWORD: ${DFR_DRILL_RUNTIME_PASSWORD:?missing}
    volumes:
      - dfr-staging-drill-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  dfr-staging-drill-data:
