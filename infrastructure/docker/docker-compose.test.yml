# DFR M1 local test PostgreSQL (see docs/architecture/m1-storage-model.md and ADR-015)
#
# Purpose: Store integration tests and migration verification for M1-A.
# **Not a production deployment file**.
#
# Safe defaults:
#   - Listens only on 127.0.0.1, on the non-default port 55432, to avoid
#     clashing with other PostgreSQL instances on the host;
#   - All passwords come from environment variables; no real credential is
#     written in compose or in the image;
#   - Two business roles are separated: dfr_migrator (can do DDL) and
#     dfr_runtime (DML only), matching infrastructure/README.md's
#     "migration identity separated from runtime identity".
#
# Usage:
#   cd infrastructure/docker
#   cp .env.example .env      # fill in random passwords (.env is excluded by .gitignore)
#   docker compose -f docker-compose.test.yml up -d --wait
#   docker compose -f docker-compose.test.yml down          # keep data volumes
#   docker compose -f docker-compose.test.yml down -v       # delete data volumes too
name: ${DFR_DB_TEST_PROJECT:-dfr-m1-test}

services:
  postgres:
    # Pinned major version: avoids minor drift making local and CI behave differently.
    image: postgres:17-alpine
    container_name: ${DFR_DB_TEST_CONTAINER:-dfr-m1-postgres-test}
    restart: 'no'
    ports:
      - '127.0.0.1:${DFR_DB_TEST_PORT:-55432}:5432'
    environment:
      POSTGRES_DB: dfr_m1_test
      POSTGRES_USER: dfr_bootstrap
      POSTGRES_PASSWORD: ${DFR_POSTGRES_BOOTSTRAP_PASSWORD:?set DFR_POSTGRES_BOOTSTRAP_PASSWORD in .env}
      DFR_MIGRATOR_PASSWORD: ${DFR_POSTGRES_MIGRATOR_PASSWORD:?set DFR_POSTGRES_MIGRATOR_PASSWORD in .env}
      DFR_RUNTIME_PASSWORD: ${DFR_POSTGRES_RUNTIME_PASSWORD:?set DFR_POSTGRES_RUNTIME_PASSWORD in .env}
    volumes:
      - dfr-m1-pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    # Resource limits: the local test environment must not consume host resources without bound.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  dfr-m1-pgdata:
