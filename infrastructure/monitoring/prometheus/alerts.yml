# DFR M1 alert rules (observability-spec chapter 8)
#
# Design principles:
#   1. Every rule states **which metric it depends on**, and metric names
#      must match the code — `tests/contract/monitoring-config.test.ts`
#      verifies that "every metric referenced in the config exists in code",
#      preventing dashboards/alerts from drifting away from the
#      implementation (a renamed metric silently going dead is the most
#      common way monitoring dies).
#   2. `for:` is always given explicitly, so transient jitter never fires
#      an alert.
#   3. Thresholds come in two kinds: **decidable** (e.g. "increment > 0",
#      which is itself an anomaly) and **needs calibration** (e.g. latency
#      thresholds depend on chain characteristics). The latter are marked
#      "needs calibration" in the comment — never presented as an
#      authoritative value.

groups:
  - name: dfr-api
    rules:
      # spec §8: API error rate over 5 minutes > 2%
      - alert: DfrApiErrorRateHigh
        expr: |
          (
            sum(rate(dfr_gateway_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(dfr_gateway_requests_total[5m]))
          ) > 0.02
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Gateway 5xx share exceeds 2%"
          description: "5xx share over the last 5 minutes is {{ $value | humanizePercentage }}; look at the route dimension of dfr_gateway_requests_total first to locate it."

      # spec §8: API latency P95 > 2s for 10 minutes (threshold needs calibration per deployment)
      - alert: DfrApiLatencyDegraded
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(dfr_gateway_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: medium
        annotations:
          summary: "Gateway P95 latency exceeds 2s"
          description: "The 2s threshold is an initial value; calibrate it against the actual chain path; use the route dimension to tell upstream from local."

      # Auth failure spike: could be a key rotation mistake, or brute-force enumeration (spec chapter 6 security defaults)
      - alert: DfrAuthFailureSpike
        expr: increase(dfr_gateway_auth_failures_total[10m]) > 50
        for: 0m
        labels:
          severity: medium
        annotations:
          summary: "More than 50 auth failures in 10 minutes"
          description: "Split by reason_code: mismatch is usually a credential error or enumeration, missing is usually a client configuration problem."

      # Frequent rate limiting means capacity or caller behavior is abnormal (not a failure, but worth knowing)
      - alert: DfrRateLimitedFrequent
        expr: increase(dfr_gateway_rate_limited_total[15m]) > 100
        for: 0m
        labels:
          severity: low
        annotations:
          summary: "More than 100 rate limits in 15 minutes"
          description: "Look at route_class to see which category is being limited; frequent read limiting usually means the caller needs to back off."

      # Idempotency conflict: the caller reused the same Idempotency-Key with a different request body (client bug)
      - alert: DfrIdempotencyConflictSpike
        expr: increase(dfr_gateway_idempotency_hits_total{outcome="conflict"}[15m]) > 10
        for: 0m
        labels:
          severity: medium
        annotations:
          summary: "More than 10 idempotency conflicts in 15 minutes"
          description: "Usually means the client is reusing an idempotency key while changing the request body; check whether the SDK generates a new key each time."

      # When the transaction store is unavailable, the Gateway actively rejects business traffic; this is a release-grade dependency failure and must not be lumped in with generic 5xx.
      - alert: DfrDependencyRejectingTraffic
        expr: increase(dfr_gateway_dependency_rejected_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Gateway is rejecting business traffic because a dependency is unavailable"
          description: "Check the affected traffic by route_class; check PostgreSQL/transaction-store connectivity — the Gateway automatically allows traffic again after recovery."

  - name: dfr-provider
    rules:
      # spec §8: a chain has 0 available Providers (urgent)
      #
      # Definition: "the read circuit breakers of **all** Providers for that
      # chain are open" is used to express "all unavailable". The reason for
      # not using availability_ratio == 0 directly: with no samples in the
      # health window, availability is recorded as 1 (see the ProviderMetrics
      # comment), so a freshly registered Provider never false-alarms; while
      # all breakers open is a definite signal that "we actively disabled
      # every candidate" — better to miss the cold-start window than to
      # false-alarm a new chain every day.
      - alert: DfrProviderAllUnavailable
        expr: |
          min by (chain) (dfr_provider_circuit_state{state="open"}) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "All Provider read circuit breakers are open for chain {{ $labels.chain }}"
          description: "Every candidate is circuit-broken, so requests fail closed as DFR_CHAIN_UNAVAILABLE. Check upstream and credentials."

      # spec §8: Provider degraded (availability < 0.5 for 5 minutes)
      - alert: DfrProviderDegraded
        expr: dfr_provider_availability_ratio < 0.5
        for: 5m
        labels:
          severity: medium
        annotations:
          summary: "Provider {{ $labels.provider_id }} availability {{ $value | humanizePercentage }}"
          description: "Below 50% for 5 minutes; combine dfr_provider_error_ratio with circuit state to judge whether it is the provider itself or upstream."

      # spec §8: circuit breaker stays open
      - alert: DfrProviderCircuitOpen
        expr: dfr_provider_circuit_state{state="open"} == 1
        for: 5m
        labels:
          severity: medium
        annotations:
          summary: "Provider {{ $labels.provider_id }} circuit breaker open for over 5 minutes"
          description: "If this is the chain's last available Provider, DfrProviderAllUnavailable fires at the same time."

      # E5: daily quota near its limit. Once exhausted, the Provider is removed, which is an availability event;
      # alert early at 80% to leave operations time to switch / scale / contact upstream.
      - alert: DfrProviderQuotaNearLimit
        expr: dfr_provider_quota_used_ratio > 0.8
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Provider {{ $labels.provider_id }} daily quota used {{ $value | humanizePercentage }}"
          description: "Over 80% for 5 minutes; combine dfr_provider_quota_used_ratio with the quota policy and prepare to switch to a backup Provider or raise the limit."

      # Provider switching/retries: write-path retries must always be 0, so any retry with method_class="write" is a **serious anomaly**
      - alert: DfrWritePathRetryDetected
        expr: increase(dfr_provider_retries_total{reason="write"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Write-path retry detected (should be 0)"
          description: "Broadcast is a non-idempotent-write; automatic Provider-layer retries must be strictly 0; a non-zero value means some code path bypasses that constraint — a funds-safety-grade issue."

  - name: dfr-adapter-core
    rules:
      # spec §8: registry ⊄ adapter — means the startup check was bypassed; urgent
      - alert: DfrAdapterRegistryMismatch
        expr: increase(dfr_adapter_registry_mismatch_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Chain {{ $labels.chain }} has a registry/adapter mismatch"
          description: "The registry declares a capability the Adapter has not implemented. Normally always 0; a non-zero value means the check was bypassed — investigate the configuration immediately."

      # Core-layer capability unsupported: same as above, a configuration/contract problem
      - alert: DfrCoreCapabilityUnsupported
        expr: increase(dfr_core_capability_unsupported_total[10m]) > 0
        for: 0m
        labels:
          severity: high
        annotations:
          summary: "Chain {{ $labels.chain }} received a call for undeclared capability {{ $labels.capability }}"
          description: "The caller requested a capability not enabled for that chain; normally always 0."

      # Adapter error rate (by adapter/chain/error_code dimensions)
      - alert: DfrAdapterErrorSpike
        expr: sum by (adapter, chain, error_code) (increase(dfr_adapter_errors_total[10m])) > 20
        for: 0m
        labels:
          severity: medium
        annotations:
          summary: "Adapter {{ $labels.adapter }} error spike on {{ $labels.chain }} ({{ $labels.error_code }})"
          description: "Combine with Provider metrics to judge whether the root cause is upstream or in the codec layer."

  - name: dfr-transaction
    rules:
      # spec §8: a chain reorg occurred (any increment > 0 alerts)
      - alert: DfrChainReorgObserved
        expr: increase(dfr_transaction_reorg_total[10m]) > 0
        for: 0m
        labels:
          severity: high
        annotations:
          summary: "Chain {{ $labels.chain }} observed a transaction reorg (depth bucket {{ $labels.depth_bucket }})"
          description: "Reorged included transactions have been rolled back to pending per ADR-021 with their block anchors cleared; check whether downstream is affected."

      # spec §8: confirmation wait is slow (threshold needs calibration — it measures "how long a single confirm request waits for the target finality",
      # not the end-to-end latency from creation to finality; see the observability-spec §5.5 semantics note)
      - alert: DfrFinalityWaitSlow
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, chain) (rate(dfr_transaction_finality_wait_seconds_bucket[15m]))
          ) > 120
        for: 10m
        labels:
          severity: medium
        annotations:
          summary: "Chain {{ $labels.chain }} confirm wait P95 exceeds 120s"
          description: "120s is an initial value; calibrate it against that chain's FinalityPolicy (e.g. confirmations count × block time)."

      # Stage failure rate: judge write-path health from states other than finalize (stage_total is a counter, split by status)
      - alert: DfrTransactionStageErrors
        expr: |
          sum by (chain, stage, error_code) (
            increase(dfr_transaction_stage_total{status="error"}[15m])
          ) > 5
        for: 0m
        labels:
          severity: medium
        annotations:
          summary: "Chain {{ $labels.chain }} {{ $labels.stage }} stage errors increased ({{ $labels.error_code }})"
          description: "Locate by stage whether it is build / simulate / broadcast / confirm; classify with error_code."

      # Tracker lease held by someone else for a long time: in a multi-instance deployment some instance may be stuck, or a single transaction is being observed very slowly
      - alert: DfrTrackerLeaseContention
        expr: |
          sum by (chain) (increase(dfr_transaction_tracker_lease_total{outcome="held_by_other"}[15m])) > 20
        for: 0m
        labels:
          severity: low
        annotations:
          summary: "Chain {{ $labels.chain }} has elevated tracker lease contention"
          description: "Normal contention in a multi-instance deployment; a persistently non-zero value under a single instance means a lease was not released — check the owner token and expiry logic."
