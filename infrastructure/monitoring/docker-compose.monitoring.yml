# DFR M1 monitoring sample: Prometheus (scrape + alert rules) + Grafana (auto-loaded dashboards)
#
# **Not a production deployment file**: a single-host sample, for "actually
# seeing the metrics that already exist". Production should connect to an
# existing Prometheus/Grafana or a managed service; this file provides a
# copyable configuration shape.
#
# Prerequisites:
#   1. The Gateway is running and /metrics is available (e.g. the instance
#      started by docker-compose.m1.yml, mapped to host 18787 by default);
#   2. Export `DFR_METRICS_API_KEY` (shaped like dfr_<8-char keyId>_<secret>),
#      and **never** write it into any file or commit it.
#
# Usage:
#   export DFR_METRICS_API_KEY="dfr_XXXXXXXX_<secret>"
#   docker compose -f infrastructure/monitoring/docker-compose.monitoring.yml up -d
#   open http://127.0.0.1:3000        # Grafana, default admin/admin (first login asks for a change)
#   open http://127.0.0.1:9090        # Prometheus
#   docker compose -f infrastructure/monitoring/docker-compose.monitoring.yml down
name: dfr-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    # Generate the scrape config at runtime (includes x-dfr-key); no credentials are stored in the repository.
    entrypoint: ['/bin/sh', '/etc/prometheus/entrypoint.sh']
    environment:
      DFR_METRICS_API_KEY: ${DFR_METRICS_API_KEY:?export DFR_METRICS_API_KEY first (format dfr_<keyId>_<secret>)}
      # By default, scrape the m1 sample Gateway's mapped port on the host; to use a service name instead, join the same network.
      DFR_METRICS_TARGET: ${DFR_METRICS_TARGET:-host.docker.internal:18787}
    extra_hosts:
      # On Linux, host.docker.internal needs an explicit declaration (macOS/Windows have it built in).
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - dfr-prometheus-data:/prometheus
    command: []
    security_opt: ['no-new-privileges:true']

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${DFR_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      # Mount only the two subdirectories in use, not the whole
      # /etc/grafana/provisioning: a bind mount covers the entire directory,
      # shadowing the image's built-in plugins/alerting/notifiers/
      # access-control, so Grafana logs a level=error on every startup
      # ("Failed to read ... no such file or directory") that drowns out real errors.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - dfr-grafana-data:/var/lib/grafana
    security_opt: ['no-new-privileges:true']

volumes:
  dfr-prometheus-data:
  dfr-grafana-data:
