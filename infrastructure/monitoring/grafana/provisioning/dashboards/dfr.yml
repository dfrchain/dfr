# Grafana dashboard auto-loading: import every JSON file in the mounted directory.
# `allowUiUpdates: false` — production dashboards are sourced from the repository, to avoid losing edits made in the UI.
apiVersion: 1

providers:
  - name: dfr
    orgId: 1
    folder: DFR
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
