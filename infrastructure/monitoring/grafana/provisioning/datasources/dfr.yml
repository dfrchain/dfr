# Grafana 数据源：uid 必须与看板 JSON 里引用的 uid 一致（`dfr-prom`），
# 否则看板加载后所有 panel 都是 "Datasource not found"。
# `tests/contract/monitoring-config.test.ts` 会校验这一致性。
apiVersion: 1

datasources:
  - name: DFR Prometheus
    uid: dfr-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
