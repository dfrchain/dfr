# Grafana datasource: the uid must match the uid referenced in the dashboard JSON (`dfr-prom`),
# otherwise every panel loads as "Datasource not found".
# `tests/contract/monitoring-config.test.ts` verifies this consistency.
apiVersion: 1

datasources:
  - name: DFR Prometheus
    uid: dfr-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
